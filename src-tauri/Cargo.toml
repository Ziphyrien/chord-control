[package]
name = "chord-control"
version = "0.4.10"
description = "Current-user Windows host for Chord plugins"
authors = ["Chord Control"]
edition = "2021"

[lib]
name = "chord_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "~2.11"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
# Typed Task Scheduler/Shell COM interfaces and Win32 token/process handles.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Registry",
  "Win32_System_TaskScheduler",
  "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }
winreg = "0.55"

[features]
custom-protocol = ["tauri/custom-protocol"]
