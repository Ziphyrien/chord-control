<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>系统信息与便笺</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px;
        color: #e8edf5;
        background: #11161e;
        font:
          15px/1.6 "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 720px;
        margin: auto;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 25px;
      }
      dl {
        display: grid;
        grid-template-columns: minmax(100px, 1fr) 2fr;
        gap: 10px 20px;
        margin: 0 0 24px;
        padding: 20px;
        background: #0b0e13;
        border: 1px solid #354153;
        border-radius: 8px;
      }
      dt {
        color: #9aa7b9;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        resize: vertical;
        padding: 12px;
        border: 1px solid #354153;
        border-radius: 8px;
        background: #0b0e13;
        color: inherit;
        font: inherit;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 14px;
      }
      button {
        padding: 10px 18px;
        border: 0;
        border-radius: 5px;
        background: #9fe870;
        color: #13200e;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid #79d8d2;
        outline-offset: 3px;
      }
      output {
        display: block;
        min-height: 24px;
        margin-top: 12px;
        color: #79d8d2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>系统信息与便笺</h1>
      <dl id="info" aria-live="polite">
        <dt>正在读取</dt>
        <dd>…</dd>
      </dl>
      <label for="note">本机便笺（最多 10000 字符）</label>
      <textarea id="note" maxlength="10000" disabled></textarea>
      <div class="actions">
        <button id="save" type="button" disabled>保存便笺</button
        ><button id="refresh" type="button">刷新主机信息</button>
      </div>
      <output id="status" aria-live="polite"></output>
    </main>
    <!--PLUGIN_SCRIPT-->
  </body>
</html>
