<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>学习权限</title>
    <style>
      body {
        font:
          15px system-ui,
          sans-serif;
        color: #28372e;
        background: #f6f7f5;
        margin: 0;
        padding: 36px;
      }
      main {
        max-width: 580px;
        margin: auto;
      }
      h1 {
        font-size: 24px;
        font-weight: 550;
      }
      p {
        color: #6d7c73;
        line-height: 1.8;
      }
      button {
        border: 1px solid #d5dfd8;
        background: white;
        padding: 12px 18px;
        border-radius: 8px;
        margin: 12px 12px 12px 0;
        font: inherit;
        color: inherit;
      }
      #status {
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>专注学习</h1>
      <p>打开浏览器需通过密保盘验证。学习壁纸已固定，更换背景的设置已禁用。</p>
      <button data-browser="edge">Microsoft Edge</button
      ><button data-browser="chrome">Google Chrome</button>
      <p id="status" role="status"></p>
    </main>
    <!--PLUGIN_SCRIPT-->
  </body>
</html>
