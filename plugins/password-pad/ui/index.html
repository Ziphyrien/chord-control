<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>密保盘</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f7f5;
        color: #23302c;
        font:
          15px system-ui,
          sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        text-align: center;
        width: 384px;
        padding: 24px;
      }
      h1 {
        font-size: 21px;
        font-weight: 550;
        margin: 0 0 10px;
      }
      p {
        color: #77837d;
        font-size: 13px;
        min-height: 20px;
      }
      .board {
        width: 336px;
        height: 336px;
        position: relative;
        touch-action: none;
        user-select: none;
      }
      .cells {
        display: grid;
        grid-template-columns: repeat(6, 56px);
        grid-template-rows: repeat(6, 56px);
      }
      .cell {
        width: 56px;
        height: 56px;
        padding: 0;
        border: 0;
        background: none;
        color: #2a3931;
        font:
          500 22px ui-monospace,
          monospace;
      }
      .cell:focus-visible {
        outline: 2px solid #5e8470;
        outline-offset: -8px;
        border-radius: 50%;
      }
      svg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        width: 336px;
        height: 336px;
      }
      polyline {
        stroke: #8bada0;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      footer {
        margin-top: 18px;
        display: flex;
        gap: 22px;
        justify-content: center;
      }
      footer button {
        border: 0;
        background: transparent;
        color: #52695d;
        font: inherit;
        cursor: pointer;
      }
      #status {
        height: 20px;
        color: #52695d;
      }
      .hidden {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">密保盘</h1>
      <p id="hint">按住并滑动，连接今日密码</p>
      <div class="board" id="board" aria-label="密保盘">
        <div class="cells" id="cells"></div>
        <svg aria-hidden="true" viewBox="0 0 336 336"><polyline id="trace"></polyline></svg>
      </div>
      <p id="status" role="status"></p>
      <footer><button id="practice">试用</button><button id="cancel">取消</button></footer>
    </main>
    <!--PLUGIN_SCRIPT-->
  </body>
</html>
