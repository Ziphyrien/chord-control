<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>密保盘</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f5;
        color: #23302c;
        font:
          15px system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 384px);
        padding: 20px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 21px;
        font-weight: 550;
        overflow-wrap: anywhere;
      }
      #cells {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        touch-action: manipulation;
        user-select: none;
      }
      button {
        aspect-ratio: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: #2a3931;
        background: transparent;
        font:
          500 22px ui-monospace,
          monospace;
      }
      button:enabled {
        cursor: pointer;
      }
      button:active:enabled {
        background: #e2ebe5;
      }
      button:focus-visible {
        outline: 2px solid #5e8470;
        outline-offset: -6px;
      }
      button:disabled {
        opacity: 0.55;
      }
      p {
        min-height: 22px;
        margin: 12px 0 0;
        color: #52695d;
        font-size: 13px;
      }
      #input {
        letter-spacing: 3px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">密保盘</h1>
      <div id="cells" role="group" aria-label="单击输入，最后点击 ＃ 确认"></div>
      <p id="input" aria-live="polite"></p>
      <p id="status" role="status"></p>
    </main>
    <!--PLUGIN_SCRIPT-->
  </body>
</html>
