<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>运行遥测</title>
    <style>
      body {
        font: 14px system-ui;
        margin: 28px;
        background: #151617;
        color: #d6ddd8;
      }
      button {
        padding: 9px 16px;
        margin: 0 8px 12px 0;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 18px;
        background: #202422;
        border-radius: 8px;
      }
      p {
        color: #a7b5ac;
      }
    </style>
  </head>
  <body>
    <h1>运行遥测</h1>
    <p>每5分钟上传运行状态。需要停止上报时，可在控制中心暂停此插件。</p>
    <button id="send">立即上报</button><button id="report">查看最近报告</button>
    <pre id="status" role="status">读取中…</pre>
    <pre id="detail" hidden></pre>
    <!--PLUGIN_SCRIPT-->
  </body>
</html>
