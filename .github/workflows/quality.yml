name: Quality checks
on:
  workflow_call:
    inputs:
      rust:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHORD_CONTROL_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts
      - run: vp run sync:svelte
      - run: vp run theme:check
      - run: vp check
      - run: vp run check:svelte
      - run: vp run knip
      - name: Install browser for telemetry dashboard verification
        run: vp exec playwright install --with-deps chromium
      - name: Build telemetry dashboard for production browser checks
        run: vp run --filter @chord-control/telemetry-dashboard build
      - run: vp test
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.rust
        with:
          components: rustfmt
      - name: Check Rust formatting and retain suggested formatting
        if: inputs.rust
        run: |
          if ! cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check; then
            cargo fmt --manifest-path src-tauri/Cargo.toml --all
            git diff -- src-tauri/src > "$RUNNER_TEMP/rustfmt.patch"
            exit 1
          fi
      - name: Test native state policies
        if: inputs.rust
        run: |
          rustc --edition=2021 --test src-tauri/src/kernel/visibility.rs -o "$RUNNER_TEMP/visibility-tests"
          "$RUNNER_TEMP/visibility-tests"
          rustc --edition=2021 --test src-tauri/src/updater/policy.rs -o "$RUNNER_TEMP/update-policy-tests"
          "$RUNNER_TEMP/update-policy-tests"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() && inputs.rust }}
        with:
          name: rust-format-suggestions
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
