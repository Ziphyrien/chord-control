name: Windows application
on:
  push:
    branches: [main]
    tags: ["app-v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  CHORD_CONTROL_REPOSITORY: ${{ github.repository }}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip
      - run: bun run format:check
      - run: bun run check
      - run: bun run typecheck
      - name: Build Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
        run: bun run build:windows
      - name: Build signed Windows release
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: bun run tauri build --ci --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Prepare signed release assets
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: node scripts/prepare-app-release.mjs
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "Chord Control $env:GITHUB_REF_NAME" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          $files = @(Get-ChildItem 'release/app/*' -File | ForEach-Object { $_.FullName })
          if ($files.Count -ne 5) { throw "Expected five release assets, found $($files.Count)" }
          gh release upload $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release files' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
        with:
          name: chord-control-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/chord-control.exe
            src-tauri/binaries/plugin-controller-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: startsWith(github.ref, 'refs/tags/app-v')
        with:
          name: chord-control-windows-x64-release
          path: release/app/*
          if-no-files-found: error
