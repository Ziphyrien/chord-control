name: Windows application
on:
  push:
    branches: [main]
    tags: ["app-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      recover_run_id:
        description: "Existing successful Windows run whose artifact should complete a draft release"
        required: false
        type: string
        default: ""
      release_tag:
        description: "Draft app tag to recover"
        required: false
        type: string
        default: "app-v0.4.2"
permissions:
  contents: read
concurrency:
  group: windows-application-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CHORD_CONTROL_REPOSITORY: ${{ github.repository }}
  TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.recover_run_id == ''
    uses: ./.github/workflows/quality.yml
    with:
      rust: true
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.recover_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: vp install --frozen-lockfile --ignore-scripts
      - name: Build Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
        run: vp exec tauri build --ci
      - name: Build signed Windows installer
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: vp exec tauri build --ci --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Test native update routing
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib updater::network::tests
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: chord-control-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/chord-control.exe
            src-tauri/binaries/plugin-controller-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: chord-control-frontend
          path: dist/
          if-no-files-found: error
  recover-release:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: chord-control-windows-x64
          path: src-tauri/
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recover_run_id }}
          github-token: ${{ github.token }}
      - name: Upload missing runtime without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sidecar="$(find src-tauri -type f -name 'plugin-controller-x86_64-pc-windows-msvc.exe' -print -quit)"
          test -n "$sidecar"
          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -Fqx 'plugin-controller-x86_64-pc-windows-msvc.exe'; then
            gh release upload "$RELEASE_TAG" "$sidecar" --repo "$REPOSITORY"
          fi
      - name: Verify all assets and publish the draft
        env:
          CHORD_CONTROL_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          vp node --input-type=module <<'NODE'
          import { publishApp } from "./scripts/publish-app.mjs";
          import { githubClient } from "./scripts/github-release.mjs";
          const repository = process.env.CHORD_CONTROL_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          await publishApp({
            repository,
            target: process.env.GITHUB_SHA,
            refType: "tag",
            refName: tag,
            client: githubClient({ repository, token: process.env.GH_TOKEN }),
          });
          console.log(`Published ${tag}`);
          NODE
  publish:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: chord-control-windows-x64
          path: src-tauri/
      - name: Set release timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Verify and publish Windows release
        run: vp node scripts/publish-app.mjs
        env:
          GH_TOKEN: ${{ github.token }}
