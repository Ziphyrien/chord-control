name: Windows application
on:
  push:
    branches: [main]
    tags: ["app-v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  CHORD_CONTROL_REPOSITORY: ${{ github.repository }}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip
      - run: bun run format:check
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test:architecture
      - run: bun run test
      - run: bun run test:periodic
      - run: bunx --no-install playwright install chromium
      - run: bun run test:ui
      - run: bun run build:windows
      - run: bun run test:sea
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $releaseDir = Join-Path $env:RUNNER_TEMP 'chord-release'
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          Copy-Item $installers[0].FullName (Join-Path $releaseDir 'Chord.Control-setup.exe')
          Copy-Item 'src-tauri/binaries/plugin-controller-x86_64-pc-windows-msvc.exe' $releaseDir
          $files = @(Get-ChildItem $releaseDir -Filter '*.exe')
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $releaseDir 'SHA256SUMS.txt') -Encoding utf8
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "Chord Control $env:GITHUB_REF_NAME" --generate-notes --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload $env:GITHUB_REF_NAME "$releaseDir/Chord.Control-setup.exe" "$releaseDir/plugin-controller-x86_64-pc-windows-msvc.exe" "$releaseDir/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release files' }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: chord-control-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: plugin-controller-windows-x64
          path: src-tauri/binaries/plugin-controller-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
