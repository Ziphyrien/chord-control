name: Windows application
on:
  push:
    branches: [main]
    tags: ["app-v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-application-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CHORD_CONTROL_REPOSITORY: ${{ github.repository }}
  TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
jobs:
  checks:
    uses: ./.github/workflows/quality.yml
    with:
      rust: true
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: vp install --frozen-lockfile --ignore-scripts
      - name: Build Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
        run: vp exec tauri build --ci
      - name: Build signed Windows installer
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: vp exec tauri build --ci --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: chord-control-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/chord-control.exe
            src-tauri/binaries/plugin-controller-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: chord-control-frontend
          path: dist/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: chord-control-windows-x64
          path: src-tauri/
      - name: Set release timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Verify and publish Windows release
        run: vp node scripts/publish-app.mjs
        env:
          GH_TOKEN: ${{ github.token }}
