name: API extension validation
on:
  push:
    branches: [main]
    paths:
      - "controller/src/runtime/**"
      - "controller/src/transport/native-bridge.ts"
      - "sdk/**"
      - "src-tauri/src/kernel/**"
      - "tests/kernel.test.mjs"
      - "tests/transport-harness.mjs"
      - "scripts/probe-host-api.mjs"
      - ".github/workflows/api-validation.yml"
  workflow_dispatch:
    inputs:
      windows_run:
        description: Windows application run whose artifacts should be exercised
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  api:
    if: ${{ !inputs.windows_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts
      - run: vp test tests/kernel.test.mjs tests/transport.test.mjs tests/controller.test.mjs tests/architecture.test.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Test visibility ownership without building the desktop
        run: |
          rustc --edition=2021 --test src-tauri/src/kernel/visibility.rs -o "$RUNNER_TEMP/visibility-tests"
          "$RUNNER_TEMP/visibility-tests"
  native:
    if: ${{ inputs.windows_run }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: chord-control-windows-x64
          path: .native-artifact
          run-id: ${{ inputs.windows_run }}
          github-token: ${{ github.token }}
      - run: vp node scripts/probe-host-api.mjs .native-artifact
