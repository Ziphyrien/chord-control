name: Publish plugins
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "sdk/**"
      - "shared/**"
      - "scripts/build-plugins.mjs"
      - "scripts/publish-plugins.mjs"
      - "package.json"
      - "bun.lock"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:
permissions:
  contents: write
env:
  CHORD_CONTROL_REPOSITORY: ${{ github.repository }}
concurrency:
  group: plugin-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip
      - run: bun run format:check
      - run: bun run typecheck
      - name: Build and sign plugins
        run: bun run plugins:build
        env:
          PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY }}
          PLUGIN_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/plugins-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish artifacts and update catalogue
        run: node scripts/publish-plugins.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_RELEASE_TAG: plugins-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-plugin-catalogue
          path: release/plugins/
          if-no-files-found: error
